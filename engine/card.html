<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>

const Q = new URLSearchParams(location.search), REC = Q.has('rec'), PURE = Q.has('pure'), FRONT = Q.has('front'), AUTO = REC || Q.has('auto');

// debug: ?hide=steps,aura,glyph,rays,bg,frame,parts,planes hides those layers
const HIDE = new Set((Q.get('hide') || '').split(',').filter(Boolean));
if (HIDE.size) block.traverse(o => { const m = o.material;
  const name = walls.some(w => w.m === o) ? 'walls' : o === edge ? 'edge' : o === backSteps || o === frontSteps || (sceneSteps && o === sceneSteps) ? 'steps' : o.isPoints ? 'parts' : m === bgMat ? 'bg' : frameL && o === frameL.mesh ? 'frame' : m?.uniforms?.uAmt ? 'aura' : m?.uniforms?.uMap && o.geometry?.parameters === undefined && m.blending === THREE.AdditiveBlending ? 'glyph' : m?.uniforms?.uCol && m.blending === THREE.AdditiveBlending ? 'rays' : m?.uniforms?.uFront ? 'planes' : '';
  if (HIDE.has(name)) o.visible = false; });

// ---------- labels for the pulled-apart view
const tagsEl = document.getElementById('tags');
const tagged = [...layers.filter(s => s.label), stepLabel].map(s => { const el = document.createElement('div'); el.className = 'tag'; el.innerHTML = `${s.label[0]}<small>${s.label[1]}</small>`; tagsEl.appendChild(el); return { s, el }; });
const tagY = s => ({ Background: .3, Crystals: .45, 'Magic glyph': .62, Aura: .78, 'Card frame': .93, 'Front crystals': .55 })[s.label[0]] ?? .12;

// ---------- motion: spring tilt toward the pointer, idle sway, click to pull apart; ?rec plays a fixed 16 s script
const ptr = { x: 0, y: 0, last: -1e9 }; let explodeTo = 0;
canvas.addEventListener('pointermove', e => { ptr.x = e.clientX / innerWidth * 2 - 1; ptr.y = e.clientY / innerHeight * 2 - 1; ptr.last = performance.now(); });

canvas.addEventListener('click', () => { explodeTo = explodeTo ? 0 : 1; });
function scripted(t) {

  const X = smooth(8.6, 9.8, t) * (1 - smooth(13.6, 14.8, t));
  const front = smooth(10.6, 11.6, t) * (1 - smooth(12.4, 13.3, t));
  return { x: k * (.75 * Math.sin(u * .62) + .1 * Math.sin(u * 1.9)) * (1 - X), y: k * .6 * Math.sin(u * .85 + .5) * (1 - X), X, front };

function draw(t) {
  const now = performance.now(); while (simT + DT <= t) { physics(simT, DT, now); simT += DT; }
  const X = clamp(S.X, -.05, 1.1), Xs = smooth(0, 1, X), tilt = clamp(Math.hypot(S.rx, S.ry) / 18, 0, 1);

window.__cardRect = () => { const a = new THREE.Vector3(wx(0), wy(0), 0).applyMatrix4(block.matrixWorld).project(camera), b = new THREE.Vector3(wx(CW), wy(CH), 0).applyMatrix4(block.matrixWorld).project(camera);
